version: 2
updates:
  - package-ecosystem: npm
    directory: /dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      renderer:
        patterns:
          - "*"
  - package-ecosystem: swift
    directory: /dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
