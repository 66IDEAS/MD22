name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the complete tagged history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the immutable version source
        shell: zsh {0}
        run: |
          if [[ $GITHUB_REF_NAME != v<->.<->.<-> ]]; then
            print -u2 "Release tags must use vMAJOR.MINOR.PATCH."
            exit 64
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Use the supported Node.js generation
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dev/package-lock.json
      - name: Install the project generator
        shell: zsh {0}
        run: |
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi
          xcodegen version
      - name: Run the complete Phase 1 verification suite
        run: dev/scripts/ci.zsh

  publish:
    name: Sign, notarize, and publish
    needs: verify
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      MD22_SIGNING_IDENTITY: ${{ secrets.MD22_SIGNING_IDENTITY }}
      MD22_TEAM_ID: ${{ secrets.MD22_TEAM_ID }}
      MD22_NOTARY_KEY_ID: ${{ secrets.MD22_NOTARY_KEY_ID }}
      MD22_NOTARY_ISSUER_ID: ${{ secrets.MD22_NOTARY_ISSUER_ID }}
    steps:
      - name: Check out the exact tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use the supported Node.js generation
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dev/package-lock.json
      - name: Install the project generator
        shell: zsh {0}
        run: |
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi
          xcodegen version
      - name: Require release immutability and a new release
        env:
          GH_TOKEN: ${{ secrets.MD22_RELEASE_ADMIN_READ_TOKEN }}
          RELEASE_TOKEN: ${{ github.token }}
        shell: zsh {0}
        run: |
          if [[ -z $GH_TOKEN ]]; then
            print -u2 "The protected immutable-release read token is missing."
            exit 78
          fi
          gh api --silent \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/immutable-releases"
          if GH_TOKEN="$RELEASE_TOKEN" \
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            print -u2 "A release already exists for $GITHUB_REF_NAME."
            exit 73
          fi
      - name: Import protected release credentials
        env:
          CERTIFICATE_BASE64: ${{ secrets.MD22_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MD22_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.MD22_NOTARY_KEY_BASE64 }}
          SPARKLE_KEY_BASE64: ${{ secrets.MD22_SPARKLE_PRIVATE_KEY_BASE64 }}
        shell: zsh {0}
        run: |
          for REQUIRED_VALUE in \
            "$CERTIFICATE_BASE64" "$CERTIFICATE_PASSWORD" \
            "$NOTARY_KEY_BASE64" "$SPARKLE_KEY_BASE64" \
            "$MD22_SIGNING_IDENTITY" "$MD22_TEAM_ID" \
            "$MD22_NOTARY_KEY_ID" "$MD22_NOTARY_ISSUER_ID"; do
            if [[ -z $REQUIRED_VALUE ]]; then
              print -u2 "A protected release credential is missing."
              exit 78
            fi
          done

          CERTIFICATE_PATH="$RUNNER_TEMP/MD22-Developer-ID.p12"
          NOTARY_KEY_PATH="$RUNNER_TEMP/MD22-Notary-Key.p8"
          SPARKLE_KEY_PATH="$RUNNER_TEMP/MD22-Sparkle-Private-Key"
          KEYCHAIN_PATH="$RUNNER_TEMP/MD22-release.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          print "::add-mask::$KEYCHAIN_PASSWORD"

          print -rn -- "$CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          print -rn -- "$NOTARY_KEY_BASE64" | base64 -D > "$NOTARY_KEY_PATH"
          print -rn -- "$SPARKLE_KEY_BASE64" | base64 -D > "$SPARKLE_KEY_PATH"
          chmod 600 "$CERTIFICATE_PATH" "$NOTARY_KEY_PATH" "$SPARKLE_KEY_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | \
            rg -F "$MD22_SIGNING_IDENTITY"

          {
            print "MD22_NOTARY_KEY_PATH=$NOTARY_KEY_PATH"
            print "MD22_SPARKLE_PRIVATE_KEY_PATH=$SPARKLE_KEY_PATH"
            print "MD22_RELEASE_KEYCHAIN_PATH=$KEYCHAIN_PATH"
          } >> "$GITHUB_ENV"
      - name: Build the Developer ID archive
        shell: zsh {0}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          export MD22_VERSION="$VERSION"
          export MD22_BUILD_NUMBER="$GITHUB_RUN_NUMBER"
          dev/scripts/archive-release.zsh
          {
            print "MD22_VERSION=$VERSION"
            print "MD22_BUILD_NUMBER=$GITHUB_RUN_NUMBER"
            print "MD22_RELEASE_DIRECTORY=$GITHUB_WORKSPACE/dev/build/release"
          } >> "$GITHUB_ENV"
      - name: Notarize and package the application
        shell: zsh {0}
        run: |
          APP_PATH="$MD22_RELEASE_DIRECTORY/MD22-$MD22_VERSION-$MD22_BUILD_NUMBER/MD22.app"
          dev/scripts/notarize-release.zsh "$APP_PATH" "$MD22_RELEASE_DIRECTORY"
      - name: Create the SBOM and signed update feed
        shell: zsh {0}
        run: |
          SBOM="$MD22_RELEASE_DIRECTORY/MD22-$MD22_VERSION.spdx.json"
          node dev/scripts/generate-sbom.mjs "$SBOM" "$MD22_VERSION"
          dev/scripts/generate-appcast.zsh \
            "$MD22_RELEASE_DIRECTORY" \
            "$MD22_SPARKLE_PRIVATE_KEY_PATH" \
            "$GITHUB_REF_NAME"
          cd "$MD22_RELEASE_DIRECTORY"
          "$GITHUB_WORKSPACE/dev/scripts/make-checksums.sh" \
            "MD22-$MD22_VERSION-arm64.dmg" \
            "MD22-$MD22_VERSION-arm64.zip" \
            "MD22-$MD22_VERSION.spdx.json" \
            appcast.xml
          shasum -a 256 -c SHA256SUMS
      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ env.MD22_RELEASE_DIRECTORY }}/SHA256SUMS
      - name: Attest the application SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ env.MD22_RELEASE_DIRECTORY }}/MD22-${{ env.MD22_VERSION }}-arm64.dmg
            ${{ env.MD22_RELEASE_DIRECTORY }}/MD22-${{ env.MD22_VERSION }}-arm64.zip
          sbom-path: ${{ env.MD22_RELEASE_DIRECTORY }}/MD22-${{ env.MD22_VERSION }}.spdx.json
      - name: Publish the immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: zsh {0}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$MD22_RELEASE_DIRECTORY/MD22-$MD22_VERSION-arm64.dmg#MD22 $MD22_VERSION for Apple silicon" \
            "$MD22_RELEASE_DIRECTORY/MD22-$MD22_VERSION-arm64.zip#Sparkle update archive" \
            "$MD22_RELEASE_DIRECTORY/MD22-$MD22_VERSION.spdx.json#SPDX software bill of materials" \
            "$MD22_RELEASE_DIRECTORY/appcast.xml#Signed Sparkle appcast" \
            "$MD22_RELEASE_DIRECTORY/SHA256SUMS#SHA-256 checksums" \
            --verify-tag \
            --draft \
            --generate-notes \
            --title "MD22 $MD22_VERSION"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          gh release verify "$GITHUB_REF_NAME"
          for ASSET in \
            "MD22-$MD22_VERSION-arm64.dmg" \
            "MD22-$MD22_VERSION-arm64.zip" \
            "MD22-$MD22_VERSION.spdx.json" \
            appcast.xml SHA256SUMS; do
            gh release verify-asset \
              "$GITHUB_REF_NAME" \
              "$MD22_RELEASE_DIRECTORY/$ASSET"
          done
      - name: Remove ephemeral credentials
        if: always()
        shell: zsh {0}
        run: |
          if [[ -n ${MD22_RELEASE_KEYCHAIN_PATH:-} && -f $MD22_RELEASE_KEYCHAIN_PATH ]]; then
            security delete-keychain "$MD22_RELEASE_KEYCHAIN_PATH" || true
          fi
          rm -f -- \
            "$RUNNER_TEMP/MD22-Developer-ID.p12" \
            "$RUNNER_TEMP/MD22-Notary-Key.p8" \
            "$RUNNER_TEMP/MD22-Sparkle-Private-Key"
