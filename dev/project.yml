name: MD22
options:
  bundleIdPrefix: com.alexander-ilg
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.4
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: false
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: true
    ENABLE_APP_SANDBOX: false
    GENERATE_INFOPLIST_FILE: false
    PRODUCT_BUNDLE_IDENTIFIER: com.alexander-ilg.MD22
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    DEAD_CODE_STRIPPING: true
    CLANG_ENABLE_MODULES: true
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  MD22:
    type: application
    platform: macOS
    sources:
      - path: MD22
      - path: ../specs/md22.icon
        buildPhase: resources
    info:
      path: MD22/Info.plist
      properties:
        CFBundleDisplayName: MD22
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSArchitecturePriority:
          - arm64
        NSHighResolutionCapable: true
        NSSupportsAutomaticGraphicsSwitching: true
        NSHumanReadableCopyright: Copyright © 2026 Alexander Ilg. Released under the MIT License.
        SUFeedURL: https://github.com/alexanderilg/MD22/releases/latest/download/appcast.xml
        SUPublicEDKey: 1QOZ3YyOnlurRuF++s3TVDzHf80ghJUcRMHRAto1dV8=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false
        SUScheduledCheckInterval: 86400
        SUVerifyUpdateBeforeExtraction: true
        SURequireSignedFeed: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.markdown
            CFBundleTypeExtensions:
              - md
              - markdown
              - mdown
              - mkd
              - mkdn
    entitlements:
      path: MD22/MD22.entitlements
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: MD22
        INFOPLIST_KEY_CFBundleDisplayName: MD22
        ASSETCATALOG_COMPILER_APPICON_NAME: md22
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: -Onone
          ENABLE_TESTABILITY: true
          DEAD_CODE_STRIPPING: false
    scheme:
      testTargets:
        - MD22Tests
        - MD22UITests
  MD22Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MD22Tests
    dependencies:
      - target: MD22
    settings:
      base:
        PRODUCT_NAME: MD22Tests
        PRODUCT_MODULE_NAME: MD22Tests
        PRODUCT_BUNDLE_IDENTIFIER: com.alexander-ilg.MD22Tests
        GENERATE_INFOPLIST_FILE: true
        BUNDLE_LOADER: $(TEST_HOST)
  MD22UITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: MD22UITests
    dependencies:
      - target: MD22
    settings:
      base:
        PRODUCT_NAME: MD22UITests
        PRODUCT_MODULE_NAME: MD22UITests
        PRODUCT_BUNDLE_IDENTIFIER: com.alexander-ilg.MD22UITests
        GENERATE_INFOPLIST_FILE: true
